apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- configmap.yaml
- deployment.yaml
- httproute.yaml

# release (llm-d-router v1.0.0): configmap.yaml uses this release's key names
# (server.secure_serving, renamed in llm-d-router#2908). The nightly component
# tracks main and uses the same name, so either works.
components:
- ../../../recipes/modelserver/components/images/coordinator/release

# LOCAL PD-only: build the PD-only pipeline into the overlay instead of the
# README's `kubectl patch` + restart. ${GATEWAY_ADDRESS} is still resolved by the
# README command's `| envsubst` after the build.
patches:
- path: patch-pd-only.yaml
